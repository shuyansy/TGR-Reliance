# SFT of Qwen2.5-VL-7B-Instruct on EviCe (single-turn format <think>[s, e]</think><answer>X</answer>).
# Run with LF_VIDEO_SAMPLING=official_oasis LF_OASIS_FAMILY=qwen25 (see run_sft.sh): frames, resolution and timestamps then
# follow the official Qwen2.5-VL sampler (1 fps, at most 128 frames), the same as in our evaluation.
### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 262144
video_max_pixels: 602112   # informational: the official sampler sets the resolution
video_fps: 1.0
video_maxlen: 128
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: evice
dataset_dir: data                 # holds dataset_info.json and EviCe.json
media_dir: /path/to/EviCe         # the downloaded EviCe folder; EviCe.json refers to videos/evice_XXXXX.mp4 in it
template: qwen2_vl
cutoff_len: 51200                 # 128 frames x <= 602,112 px -> <= 49,152 visual tokens + text
max_samples: 40000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen2_5vl_7b_evice_sft
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1    # we trained on 16 GPUs (global batch 16); use 2 on 8 GPUs
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
