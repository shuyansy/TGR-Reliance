# Multi-turn SFT (Video-o3 tool format) of Qwen2.5-VL-7B-Instruct with the SFT code of Video-o3 (its LLaMA-Factory fork, main @ e93f563,
# patched with patches/video_o3_qwen25.patch). Data: tools/build_sft_data.py --family qwen25 (absolute video paths, so no media_dir).
# The full video is sampled at 2 fps (<= 768 frames, 1,024-16,384 tokens); every crop is sampled by its "sample" strategy (Video-o3 budgets).
### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 262144
video_max_pixels: 602112
video_min_pixels: 100352
video_fps: 2.0
video_maxlen: 768
min_token_number: 1024
max_token_number: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json   # relative to Video-o3/SFT

### dataset
dataset: evice_multiturn_qwen25
dataset_dir: data                 # holds dataset_info.json and evice_multiturn_qwen25.json
template: qwen2_vl
cutoff_len: 40000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen2_5vl_7b_multiturn_sft
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1    # we trained on 16 GPUs (global batch 16); use 2 on 8 GPUs
learning_rate: 1.0e-5
num_train_epochs: 1.0
max_steps: 292                    # we used 4,800 questions (build_sft_data.py --n 4800)
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000
